Implement in the native project; use the standalone contract only for isolated HTML/CSS. With a known MCP mode/root, call format directly for asset checks, formatting and detailed validation errors. Otherwise resolve the target once. Use the bundled helper if native NASANI tools are missing; do not create another harness.
Run applicable checks and compare design/mobile browser rendering. Recheck affected areas after fixes. Report files, checks and limitations; AST success is not visual proof. No separate AI key, secret uploads or ZIP unless requested.
"""
